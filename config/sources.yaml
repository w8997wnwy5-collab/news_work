    tipo: community
    peso: 10
    url: "https://community.sap.com/t5/technology-blog-posts-by-members/bg-p/technology-blog-members/rss"
    fallback:
      - "https://community.sap.com/khhcw49343/rss/board?board.id=technology-blog-members"

