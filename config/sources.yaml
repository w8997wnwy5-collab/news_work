# ---------------------------------------------------------------------------
# Fonti RSS/Atom del radar.
#
#   tipo:     official | community | press | vendor
#   peso:     bonus di credibilità sul punteggio di rilevanza
#   url:      feed principale
#   fallback: feed alternativi provati in ordine se il principale non risponde
#             (i siti SAP cambiano spesso i path RSS: il fallback evita che una
#              fonte muoia in silenzio)
#   vendor:   id in config/vendors.yaml -> la card mostra i pulsanti Demo/Call
#   solo_se:  se presente, la notizia entra solo se contiene uno di questi
#             termini (usato per fonti generaliste come Diginomica o Reddit)
#
# Il pannello "Controllo" della dashboard mostra lo stato di ogni fonte:
# se una resta rossa per giorni, cambiare l'url qui è l'unica azione richiesta.
# ---------------------------------------------------------------------------

defaults:
  max_items: 25          # elementi letti per fonte ad ogni giro
  timeout: 20            # secondi

# Vendor senza un feed pubblico utilizzabile: restano nel catalogo di
# config/vendors.yaml (con demo e contatti), ma non alimentano le notizie.
#   - Basis Technologies, Enterprise Times: il loro sito risponde 403 alle
#     richieste automatiche, e non aggiriamo un blocco esplicito.

sources:
  # ----------------------------- SAP ufficiale -----------------------------
  - id: sap_news_center
    nome: "SAP News Center"
    tipo: official
    peso: 20
    url: "https://news.sap.com/feed/"

  - id: sap_news_italia
    nome: "SAP News Italia"
    tipo: official
    peso: 20
    url: "https://news.sap.com/italy/feed/"
    fallback:
      - "https://news.sap.com/italy/feed/atom/"

  - id: sap_community_tech
    nome: "SAP Community - Technology blogs"
    tipo: official
    peso: 16
    url: "https://community.sap.com/t5/technology-blog-posts-by-sap/bg-p/technology-blog-sap/rss"
    fallback:
      - "https://community.sap.com/khhcw49343/rss/board?board.id=technology-blog-sap"
      - "https://blogs.sap.com/feed/"

  - id: sap_community_erp
    nome: "SAP Community - ERP blogs"
    tipo: official
    peso: 16
    url: "https://community.sap.com/t5/enterprise-resource-planning-blog-posts-by-sap/bg-p/erp-blog-sap/rss"
    fallback:
      - "https://community.sap.com/khhcw49343/rss/board?board.id=erp-blog-sap"

  - id: sap_community_members
