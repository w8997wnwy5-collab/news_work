# ---------------------------------------------------------------------------
# Tassonomia e profilo della nostra soluzione.
#
# Questo file decide DUE cose:
#   1. in quale categoria finisce una notizia  -> blocco `categories`
#   2. quanto ci riguarda  (punteggio 0-100)   -> blocco `profile`
#
# Modificare qui è il modo previsto per tarare il radar: nessun codice Python
# va toccato. Dopo una modifica basta rilanciare `python -m sapnews update`.
# ---------------------------------------------------------------------------

profile:
  name: "S/4HANA Private Cloud / On-premise + SAP BTP & Integration Suite"
  descrizione: >-
    Core ERP S/4HANA in private cloud / on-premise (percorso RISE e clean core),
    esteso e integrato tramite SAP BTP: Integration Suite (CPI), estensioni
    ABAP Cloud / CAP, Build e Datasphere. Aree funzionali seguite: Finance,
    Logistica, HR & Procurement SaaS, Tech (Basis, Security, ABAP, AI).

  # Termini che indicano "questa notizia parla proprio del nostro stack".
  # weight si somma al punteggio di rilevanza.
  boost:
    - {term: "s/4hana", weight: 24}
    - {term: "s4hana", weight: 24}
    - {term: "private cloud", weight: 20}
    - {term: "rise with sap", weight: 18}
    - {term: "on-premise", weight: 14}
    - {term: "on premise", weight: 14}
    - {term: "clean core", weight: 22}
    - {term: "business technology platform", weight: 22}
    - {term: "btp", weight: 22}
    - {term: "integration suite", weight: 22}
    - {term: "cloud integration", weight: 16}
    - {term: "cpi", weight: 14}
    - {term: "abap cloud", weight: 18}
    - {term: "restful application programming", weight: 14}
    - {term: "cap ", weight: 8}
    - {term: "cloud application programming", weight: 14}
    - {term: "sap build", weight: 14}
    - {term: "datasphere", weight: 14}
    - {term: "joule", weight: 14}
    - {term: "release 20", weight: 12}
    - {term: "maintenance 2027", weight: 20}
    - {term: "2027", weight: 10}
    - {term: "2030", weight: 8}
    - {term: "upgrade", weight: 10}
    - {term: "feature pack", weight: 12}
    - {term: "sap note", weight: 12}
    - {term: "sap notes", weight: 12}
    - {term: "fiori", weight: 10}
    - {term: "sap gui", weight: 8}
    - {term: "eudr", weight: 8}
    - {term: "e-invoicing", weight: 10}
    - {term: "fatturazione elettronica", weight: 12}

  # Termini che segnalano prodotti / segmenti che NON usiamo: abbassano il
  # punteggio senza escludere la notizia (resta visibile come "info").
  penalize:
    - {term: "business one", weight: -22}
    - {term: "business bydesign", weight: -22}
    - {term: "grow with sap", weight: -10}
    - {term: "public cloud edition", weight: -6}
    - {term: "ecc 6.0 only", weight: -4}

  # Soglie di classificazione del livello di attenzione.
  soglie:
    must: 70      # "Da leggere"
    watch: 40     # "Da monitorare"
                  # sotto watch -> "Info"

  # Punteggio minimo per entrare nel radar: sotto questa soglia la notizia
  # viene considerata rumore e scartata.
  min_score: 15

  # SAP Community pubblica gli stessi contenuti anche in coreano, giapponese e
  # cinese: notizie pertinenti ma illeggibili per il team. Con questa opzione
  # restano fuori i titoli scritti in un alfabeto non latino.
  # Metterla a false per ricevere anche quelli.
  solo_alfabeto_latino: true

# ---------------------------------------------------------------------------
# Categorie. `color_slot` punta alla palette categoriale validata della
# dashboard (slot 1-8, ordine fisso: non riordinare senza rivalidare i colori).
# ---------------------------------------------------------------------------
