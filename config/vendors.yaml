# ---------------------------------------------------------------------------
# Catalogo dei tool esterni che funzionano bene sul NOSTRO stack
# (S/4HANA private cloud / on-premise + SAP BTP & Integration Suite).
#
# Ogni voce alimenta una card nella scheda "Vendor & Tool" della dashboard, con
# i pulsanti per la documentazione, la demo e la richiesta di call al vendor.
# Se un vendor ha anche un blog RSS, lo si aggancia in config/sources.yaml con
# `vendor: <id>`: in quel caso le sue notizie mostrano gli stessi pulsanti.
#
# link.demo / link.call sono facoltativi: se mancano (o se il controllo
# settimanale li segna rotti) la dashboard ripiega sul sito ufficiale, quindi
# un pulsante non porta mai su una pagina morta.
# ---------------------------------------------------------------------------

hub:
  sap_store: "https://store.sap.com"
  partner_finder: "https://partnerfinder.sap.com"
  certified_solutions: "https://www.sap.com/partners/find.html"

vendors:
  # ------------------------------- Security -------------------------------
  - id: onapsis
    nome: "Onapsis"
    categoria: security
    claim: "Vulnerability management e sicurezza del codice per SAP"
    cosa_fa: >-
      Scansiona sistemi ABAP e HANA per vulnerabilità, misconfigurazioni e
      note di sicurezza mancanti; analizza il codice custom prima del trasporto.
    perche_ci_serve: >-
      Su S/4HANA private restiamo noi responsabili del patching: Onapsis
      trasforma il Patch Day SAP in una lista di azioni per sistema, e il
      controllo codice si inserisce nel gate di trasporto verso il clean core.
    maturita: "Partner SAP, molto diffuso in enterprise"
    integrazione: ["S/4HANA private", "ECC", "HANA", "BTP"]
    link:
      sito: "https://onapsis.com"
      docs: "https://onapsis.com/resources/"
      demo: "https://onapsis.com/contact-us/"
      linkedin: "https://www.linkedin.com/company/onapsis"

  - id: securitybridge
    nome: "SecurityBridge"
    categoria: security
    claim: "Piattaforma di sicurezza SAP-native (add-on ABAP)"
    cosa_fa: >-
      Monitoraggio in tempo reale di eventi, patch, autorizzazioni e anomalie
      direttamente dentro il sistema SAP, con inoltro al SIEM aziendale.
    perche_ci_serve: >-
      Essendo un add-on ABAP non richiede infrastruttura esterna: adatto a un
      private cloud dove vogliamo telemetria di sicurezza senza aprire flussi.
    maturita: "SAP certified, focus esclusivo su SAP"
    integrazione: ["S/4HANA private", "ECC", "BTP"]
    link:
      sito: "https://securitybridge.com"
      linkedin: "https://www.linkedin.com/company/securitybridge"

  - id: pathlock
    nome: "Pathlock"
    categoria: security
    claim: "Access governance, SoD e controlli continui"
    cosa_fa: >-
      Analisi dei conflitti di segregazione dei compiti, gestione accessi
      privilegiati e monitoraggio delle transazioni sensibili.
    perche_ci_serve: >-
      Alternativa (o complemento) a SAP GRC Access Control quando servono
      controlli cross-application tra S/4HANA, SuccessFactors e Ariba.
    maturita: "SAP certified"
    integrazione: ["S/4HANA private", "SuccessFactors", "Ariba"]
    link:
      sito: "https://pathlock.com"
      docs: "https://pathlock.com/resources/"
      demo: "https://pathlock.com/request-a-demo/"
      linkedin: "https://www.linkedin.com/company/pathlock"

